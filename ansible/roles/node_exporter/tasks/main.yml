---
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter (checksum verified against the release)
  ansible.builtin.get_url:
    url: "{{ node_exporter_base_url }}/{{ node_exporter_release }}.tar.gz"
    dest: "/tmp/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
    mode: "0644"

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_release }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    creates: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}/node_exporter"

- name: Point /usr/local/bin/node_exporter to this version
  ansible.builtin.file:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
    force: true
  notify: Restart node_exporter

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a pending restart now (new version or new unit)
  ansible.builtin.meta: flush_handlers

- name: Check that the metrics answer
  ansible.builtin.uri:
    url: "http://{{ node_exporter_listen_address }}/metrics"
    return_content: false
  register: node_exporter_metrics
  retries: 5
  delay: 3
  until: node_exporter_metrics.status == 200
