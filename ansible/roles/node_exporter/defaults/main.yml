---
# Overridden by inventory/group_vars/all.yml.
node_exporter_version: "1.13.1"

# Listen on the private IP only: Prometheus (in k3s) scrapes it on 10.10.10.0/24.
node_exporter_listen_address: "{{ ansible_host }}:9100"

node_exporter_install_dir: /opt
node_exporter_user: node_exporter

# Debian architecture names -> Prometheus release names.
node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
node_exporter_arch: "{{ node_exporter_arch_map[ansible_facts['architecture']] }}"

node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
