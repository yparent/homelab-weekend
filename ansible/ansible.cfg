[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
forks = 10
stdout_callback = default
result_format = yaml
retry_files_enabled = false

[ssh_connection]
pipelining = true
# Dedicated known_hosts file, ignored by Git. The VMs are rebuilt every weekend
# with new host keys: "make forget-hostkeys" empties this file without touching
# your personal ~/.ssh/known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=.known_hosts -o StrictHostKeyChecking=accept-new
