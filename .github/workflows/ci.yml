# Minimal CI: static checks only. Runs on GitHub-hosted runners,
# never touches the homelab (no secret, nothing exposed at home).
#
# Actions are pinned by full commit SHA, not by tag: in March 2026 the tags of
# aquasecurity/trivy-action were rewritten by an attacker (CVE-2026-33634).
# A SHA cannot be moved. Dependabot (or Renovate) can bump them for you.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentofu:
    name: OpenTofu fmt + validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: opentofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.10
          tofu_wrapper: false

      - name: tofu fmt -check
        run: tofu fmt -check -recursive -diff

      - name: tofu init (no backend, no credentials)
        run: tofu init -backend=false -input=false

      - name: tofu validate
        run: tofu validate

  ansible:
    name: ansible-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install ansible-core + ansible-lint
        run: pip install "ansible-core==2.22.0" "ansible-lint==26.11.1"

      - name: ansible-lint (production profile)
        run: ansible-lint

  trivy:
    name: trivy config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan IaC and Kubernetes manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
