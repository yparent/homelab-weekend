apiVersion: v1
kind: ConfigMap
metadata:
  name: hello
  namespace: demo
  labels:
    app.kubernetes.io/name: hello
data:
  # Message displayed by the app. Injected as the APP_MESSAGE environment variable.
  message: "Bonjour depuis le homelab du week-end"
  # The app itself: ~40 lines of Python, standard library only.
  app.py: |
    import os
    import sys
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    # 1. Mandatory configuration: a real app often crashes like this at startup.
    message = os.environ.get("APP_MESSAGE")
    if not message:
        print("FATAL: la variable d'environnement APP_MESSAGE est absente, arret.", file=sys.stderr, flush=True)
        sys.exit(1)

    # 2. "Warm cache" loaded at startup. It really uses memory:
    #    with a memory limit below ~60 MiB the container is OOMKilled.
    cache_mb = int(os.environ.get("APP_CACHE_MB", "48"))
    cache = b"x" * (cache_mb * 1024 * 1024)
    print(f"cache charge : {cache_mb} MiB", flush=True)


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok\n"
                content_type = "text/plain"
            else:
                body = f"<h1>{message}</h1><p>pod : {os.environ.get('HOSTNAME', '?')}</p>\n".encode()
                content_type = "text/html; charset=utf-8"
            self.send_response(200)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print(f"{self.address_string()} {fmt % args}", flush=True)


    print("ecoute sur :8080", flush=True)
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
