# PANNE 3 - missing environment variable -> the app exits with code 1 -> CrashLoopBackOff.
# Apply:    kubectl apply -f kubernetes/demo-app/pannes/03-variable-manquante.yaml
# Observe:  kubectl -n demo get pods -w
#           kubectl -n demo logs <new-pod>            (FATAL: ... APP_MESSAGE ...)
#           kubectl -n demo logs <new-pod> --previous (logs of the previous crash)
# Restore:  kubectl apply -f kubernetes/demo-app/20-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
  labels:
    app.kubernetes.io/name: hello
  annotations:
    kubernetes.io/change-cause: "panne 3 : variable APP_MESSAGE manquante"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: docker.io/library/python:3.13.18-alpine3.24
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/app.py"]
          env:
            # <- PANNE: APP_MESSAGE has been removed
            - name: APP_CACHE_MB
              value: "48"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: hello
            items:
              - key: app.py
                path: app.py
