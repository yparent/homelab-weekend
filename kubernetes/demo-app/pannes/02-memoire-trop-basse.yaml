# PANNE 2 - memory limit too low -> OOMKilled, then CrashLoopBackOff.
# The app loads a 48 MiB cache at startup, the limit is 32 MiB.
# Apply:    kubectl apply -f kubernetes/demo-app/pannes/02-memoire-trop-basse.yaml
# Observe:  kubectl -n demo get pods -w
#           kubectl -n demo describe pod <new-pod>   (Last State: Terminated, Reason: OOMKilled, Exit Code: 137)
# Restore:  kubectl apply -f kubernetes/demo-app/20-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
  labels:
    app.kubernetes.io/name: hello
  annotations:
    kubernetes.io/change-cause: "panne 2 : limite memoire trop basse"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: docker.io/library/python:3.13.18-alpine3.24
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/app.py"]
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: hello
                  key: message
            - name: APP_CACHE_MB
              value: "48"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 32Mi  # <- PANNE (the app needs ~60 MiB)
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: hello
            items:
              - key: app.py
                path: app.py
