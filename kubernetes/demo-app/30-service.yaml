# NodePort on the k3s VM: http://10.10.10.13:30080 (reachable through Tailscale only,
# 10.10.10.0/24 is a private network behind the host NAT).
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: demo
  labels:
    app.kubernetes.io/name: hello
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hello
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
