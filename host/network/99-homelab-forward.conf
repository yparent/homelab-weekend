# /etc/sysctl.d/99-homelab-forward.conf
# Required for the VM NAT (vmbr1 -> Internet) and for the Tailscale subnet router.
# Apply without reboot: sysctl --system
net.ipv4.ip_forward = 1
# IPv6 forwarding is not needed here (the VMs are IPv4 only).
# Tailscale prints a warning about it, you can ignore it.
