# /etc/ssh/sshd_config.d/10-homelab-hardening.conf (Proxmox host)
# sshd keeps the FIRST value it reads: a "10-" file wins over a "50-" file.
# Check before reloading: sshd -t && systemctl reload ssh
PasswordAuthentication no
KbdInteractiveAuthentication no
# Proxmox needs root over SSH for some internal operations: key only, never password.
PermitRootLogin prohibit-password
X11Forwarding no
MaxAuthTries 3
